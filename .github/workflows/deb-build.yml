name: DEB build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ created ]

jobs:
  build-debs:
    name: ${{ matrix.distribution }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: debian-12
            image: debian:12
          - distribution: ubuntu-22.04
            image: ubuntu:22.04
          - distribution: ubuntu-24.04
            image: ubuntu:24.04

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      # git must be present before checkout, otherwise actions/checkout
      # downloads a tarball without .git and the version cannot be computed.
      - name: Install git
        run: apt-get update && apt-get install -y git

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # full history for the commit count in the package version
          fetch-depth: 0

      - name: Install dependencies
        run: sh extras/install_deps.sh

      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./autogen.sh
          ./configure CFLAGS="-O2 -g -Wall -Werror -Wno-unused-but-set-variable"
          make -j"$(nproc)"
          make distclean

      - name: Build DEBs
        run: extras/make_debs.sh

      - name: Upload DEB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.distribution }}
          path: build/debs/*.deb
          if-no-files-found: error
